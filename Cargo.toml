[package]
name = "ariawatch"
version = "0.2.0"
edition = "2024"
description = "A TUI for monitoring aria2 downloads"
license = "MIT"
repository = "https://github.com/AnkitKumarDhal/ariaWatch"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
